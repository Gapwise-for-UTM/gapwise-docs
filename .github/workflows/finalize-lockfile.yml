name: Finalize docs lockfile

on:
  push:
    branches: [security/and-143-docs-supply-chain]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
      - name: Resolve lockfile against exact package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lockfile and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/finalize-lockfile.yml
          git commit -m "build: normalize pinned docs lockfile"
          git push origin HEAD:${{ github.ref_name }}
