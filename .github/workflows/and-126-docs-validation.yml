name: AND-126 docs validation

on:
  push:
    branches:
      - codex/update-gapwise-developer-documentation
    paths:
      - ".github/workflows/and-126-docs-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:brand
      - run: npm run check
      - run: npm run build
      - name: Verify generated AI routes and root-relative links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          expected = [
              "ai/index.html",
              "ai/connect/index.html",
              "ai/authentication/index.html",
              "ai/tools/index.html",
              "ai/permissions/index.html",
              "ai/privacy/index.html",
              "ai/compatibility/index.html",
              "ai/examples/index.html",
              "ai/limitations/index.html",
          ]
          dist = Path("dist")
          for rel in expected:
              if not (dist / rel).is_file():
                  raise SystemExit(f"missing generated route: {rel}")

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag not in {"a", "link", "script", "img"}:
                      return
                  for key, value in attrs:
                      if key in {"href", "src"} and value:
                          self.urls.append(value)

          failures = []
          for html in dist.rglob("*.html"):
              parser = Links()
              parser.feed(html.read_text(errors="ignore"))
              for url in parser.urls:
                  parsed = urlparse(url)
                  if parsed.scheme or parsed.netloc or not parsed.path.startswith("/"):
                      continue
                  path = parsed.path
                  if path.startswith("//"):
                      continue
                  if path == "/":
                      candidates = [dist / "index.html"]
                  elif path.endswith("/"):
                      candidates = [dist / path.lstrip("/") / "index.html"]
                  else:
                      target = dist / path.lstrip("/")
                      candidates = [target, target / "index.html", target.with_suffix(".html")]
                  if not any(candidate.exists() for candidate in candidates):
                      failures.append((str(html.relative_to(dist)), url))
          if failures:
              for source, url in failures[:50]:
                  print(f"broken root-relative link from {source}: {url}")
              raise SystemExit(f"found {len(failures)} broken root-relative links/assets")
          print("AI routes and generated root-relative links verified")
          PY
